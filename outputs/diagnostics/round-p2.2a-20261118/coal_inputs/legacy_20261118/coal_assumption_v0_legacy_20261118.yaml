# legacy alias（O/C 与现有 feature 仍引用此键）
carbon_mass_fraction_adb:
  value: 0.7301
  unit: mass_fraction
  basis: adb
  label_zh: 干燥基碳含量
  alias_of: ultimate_analysis_dry.carbon
  source:
    type: lims_table
    sheet: "原料煤分析结果"
    row_label: "干燥基各元素组分"
    element: C
  caveat: >
    来自试烧煤质分析单次/低频结果；v0 假设全时段恒定。
    与 ultimate_analysis_dry.carbon 同值。

heating_value_dry_kj_kg:
  value: 27720
  unit: kJ/kg
  basis: adb
  label_zh: 干燥基低位发热量
  excel_row: 4
  excel_col: LHV
  source: { type: lims_table, sheet: "原料煤分析结果" }
  model_input_role: optional

# --- 工业分析（空干基 / 干燥基） ---
proximate_analysis:
  moisture_ar:
    value: 0.1577
    unit: mass_fraction
    basis: ar
    label_zh: 收到基水分 Mar
    excel_row: 7
    excel_col: M_ar
    source: { type: lims_table, sheet: "原料煤分析结果", field: M_ar }
    used_in_v0: true
    notes: B 列称重给煤机原煤流量去水；m_dry = m_ar × (1 - M_ar)
    model_input_role: feed_dry_basis
  volatile_matter_d:
    value: 0.32773
    unit: mass_fraction
    basis: db
    label_zh: 干燥基挥发分 Vd
    excel_row: 7
    source: { type: lims_table, sheet: "原料煤分析结果", field: V_d }
    model_input_role: optional
  fixed_carbon_d:
    value: 0.56727
    unit: mass_fraction
    basis: db
    label_zh: 干燥基固定碳 FCd
    excel_row: 7
    source: { type: lims_table, sheet: "原料煤分析结果", field: FC_d }
    model_input_role: optional
  ash_d:
    value: 0.105
    unit: mass_fraction
    basis: db
    label_zh: 干燥基灰分 Ad
    excel_row: 7
    source: { type: lims_table, sheet: "原料煤分析结果", field: A_d }
    model_input_role: optional

# legacy top-level key（与 proximate_analysis.moisture_ar 同值）
moisture_ar:
  value: 0.1577
  unit: mass_fraction
  basis: ar
  alias_of: proximate_analysis.moisture_ar
  source:
    type: lims_table
    sheet: "原料煤分析结果"
    field: M_ar
  used_in_v0: true
  notes: B 列称重给煤机原煤流量去水；与 proximate_analysis.moisture_ar 同值

# --- 干燥无灰基 daf（表内与干燥基元素同值，已原样录入） ---
ultimate_analysis_daf:
  carbon: { value: 0.7301, unit: mass_fraction, basis: daf, source: { type: lims_table } }
  hydrogen: { value: 0.04324, unit: mass_fraction, basis: daf, source: { type: lims_table } }
  oxygen: { value: 0.10855, unit: mass_fraction, basis: daf, source: { type: lims_table } }
  nitrogen: { value: 0.0094, unit: mass_fraction, basis: daf, source: { type: lims_table } }
  sulfur: { value: 0.00371, unit: mass_fraction, basis: daf, source: { type: lims_table } }
  notes: >
    Excel 表中 daf 行与干燥基元素数值相同；未单独重算 daf。
    若后续需要严格 daf，应由干燥基元素与灰分重新归一化。

# --- 工程/派生物性 ---
coal_average_molar_mass:
  value: 8.9884
  unit: kg/kmol
  label_zh: 煤平均摩尔质量（由元素组成派生，档案用）
  source:
    type: derived
    formula_id: coal_molar_mass_from_ultimate_v0
    expression: "M_avg = 1 / sum(w_i / M_i) for C,H,O,N,S"
    inputs: ultimate_analysis_dry
    implementation: src/ingest/coal_assumption_tools.py#compute_coal_average_molar_mass_kg_kmol
  model_input_role: reference
  used_in_v0: false
  notes: >
    fixed-physics 1D 煤进料用 ṁ_coal [kg/s]，不做煤→摩尔流量换算。
    O/C 特征亦只用 w_C 与 M_C，不用本量。
