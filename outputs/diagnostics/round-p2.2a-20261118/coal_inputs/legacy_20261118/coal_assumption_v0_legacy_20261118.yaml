#
# 来源：raw/0928-0929--1#气化炉--神优3煤气化试烧过程性能评价统计表-20220930.xlsx
#       sheet「原料煤分析结果」
# 警告：v0 对全时序为常数，不代表分钟级真实煤质。

feature_version: "v0_baseline_coal_assumption_legacy_20261118"

provenance:
  coal_label: "1#气化炉神优3：100%"
  source_file: "0928-0929--1#气化炉--神优3煤气化试烧过程性能评价统计表-20220930.xlsx"
  source_sheet: "原料煤分析结果"
  source_file_pattern: "试烧总结报告"
  lims_frequency: low
  time_varying: false
  parser: src/ingest/coal_analysis.py#parse_coal_analysis_sheet

coal_grade:
  name: "神优3"
  gasifier: "1#气化炉"
  blend_ratio: "100%"

